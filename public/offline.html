<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fără conexiune — Numerologia</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px; text-align: center;
    background: #2d1b4e; color: #f0eaff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 30rem; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 50%;
    border: 2px solid rgba(212, 175, 55, .55);
    display: flex; align-items: center; justify-content: center;
    color: #d4af37; font-size: 24px; font-weight: 600;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 12px; letter-spacing: -.01em; }
  p { margin: 0 0 24px; line-height: 1.6; color: #bfb2da; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: #d4af37; color: #2d1b4e; border: 0;
    padding: 11px 24px; border-radius: 8px;
  }
  button:hover { background: #e0bf52; }
  button:focus-visible { outline: 2px solid #f0eaff; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">?</div>
    <h1>Nu ai conexiune</h1>
    <p>Calculele de numerologie se fac în browserul tău, deci merg și offline — dar pagina asta nu a apucat să fie salvată. Reîncearcă odată ce revine internetul.</p>
    <button type="button" onclick="location.reload()">Reîncarcă</button>
  </div>
</body>
</html>
