name: CI

# What this used to do -- build Docker images for a Python backend, a Weaviate
# stack and a Kubernetes deployment -- described a system that was never running.
# Production is the Vite build plus the Express API in server/, both started by
# pm2 on the machine that serves them. This checks exactly that and nothing else.
#
# It deliberately does not deploy. A green workflow that does not touch what is
# live is worse than no workflow, because it reads as a guarantee.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Not gating yet: five errors predate this workflow -- four
      # no-explicit-any in src/lib/numerology-plus/content/ and one prefer-const
      # in server/src/routes/admin.ts. Left visible rather than hidden, and
      # rather than shipping a workflow that is red on its first run. Drop
      # continue-on-error once those five are typed.
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

      # src/data/routes.json is the one place routes are declared; sitemap.xml,
      # the prerendered per-route HTML and the static server's 404 allowlist are
      # generated from it. Assert the generation actually ran, and that the
      # development-only pages stayed out of the public bundle.
      - name: Route artefacts
        run: |
          test -s dist/sitemap.xml
          test -s dist/routes.json
          grep -q compass.oneaigency.com dist/sitemap.xml
      - name: No internal pages in the public bundle
        run: |
          if grep -rqs "MCP Servers" dist/assets/*.js; then
            echo "the admin panel is in the production bundle; build without VITE_INCLUDE_INTERNAL"
            exit 1
          fi

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
